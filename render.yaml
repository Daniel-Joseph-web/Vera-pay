services:
  # -------------------------------------------------------------
  # Verapay Backend API Service (Node.js / Express - 100% Free Plan)
  # -------------------------------------------------------------
  - type: web
    name: verapay-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        fromService:
          type: web
          name: verapay-frontend
          property: host
      - key: DATABASE_URL
        value: "postgresql://demo:demo@localhost:5432/verapay_db"
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYSTACK_SECRET_KEY
        value: sk_test_placeholder

  # -------------------------------------------------------------
  # Verapay Frontend Web Application (Next.js 14 - 100% Free Plan)
  # -------------------------------------------------------------
  - type: web
    name: verapay-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: verapay-backend
          property: host
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false

services:
  # -------------------------------------------------------------
  # Verapay Backend API Service (Node.js / Express)
  # -------------------------------------------------------------
  - type: web
    name: verapay-backend
    env: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        fromService:
          type: web
          name: verapay-frontend
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: verapay-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYSTACK_SECRET_KEY
        sync: false

  # -------------------------------------------------------------
  # Verapay Frontend Web Application (Next.js 14)
  # -------------------------------------------------------------
  - type: web
    name: verapay-frontend
    env: node
    plan: starter
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: verapay-backend
          property: host

databases:
  # -------------------------------------------------------------
  # Verapay PostgreSQL Production Database
  # -------------------------------------------------------------
  - name: verapay-db
    plan: starter
    databaseName: verapay_db
    user: verapay_user
